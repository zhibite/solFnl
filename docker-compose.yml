version: '3.8'

services:
  gmgndaily:
    build: .
    restart: unless-stopped
    volumes:
      # Plain `docker compose up` persistence (named volume).
      # NOTE on Coolify: if you mount storage in the Coolify UI
      # (e.g. host /gmgndaily/data -> container /data), DELETE this
      # volumes block to avoid double-mounting /data.
      - gmgndaily_data:/data
    # NOTE: no env_file here on purpose. The repo does not ship a `.env`
    # file, and a missing env_file breaks `docker compose up`.
    # Provide variables via the shell / Coolify environment instead.
    # See `.env.docker` for the full list.
    environment:
      - DATABASE_PATH=/data/gmgndaily.db
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8038/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gmgndaily_data:
