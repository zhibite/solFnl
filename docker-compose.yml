version: '3.8'

services:
  gmgndaily:
    build: .
    restart: unless-stopped
    volumes:
      # Coolify: 在 Storage 选项卡中挂载 /gmgndaily/data 到容器 /data
      - /gmgndaily/data:/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/gmgndaily.db
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8038/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
