services:
  gmgndaily:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8038}:8038"
    volumes:
      # Plain `docker compose up` persistence (named volume).
      # NOTE on Coolify: if you mount storage in the Coolify UI
      # (e.g. host /gmgndaily/data -> container /data), DELETE this
      # volumes block to avoid double-mounting /data.
      - gmgndaily_data:/data
    # `docker compose` reads `.env` in this directory for ${...}
    # interpolation. At minimum set GMGN_PASSWORD there (see .env.docker).
    # A missing/empty GMGN_PASSWORD makes compose fail fast rather than
    # starting with a known default password.
    environment:
      - DATABASE_PATH=/data/gmgndaily.db
      - DEBOT_SESSION_ID=${DEBOT_SESSION_ID:-}
      - GMGN_PASSWORD=${GMGN_PASSWORD:?set GMGN_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CHAIN=${CHAIN:-sol}
      - SYNC_INTERVAL_MIN=${SYNC_INTERVAL_MIN:-60}
      - HISTORY_SYNC_INTERVAL_MIN=${HISTORY_SYNC_INTERVAL_MIN:-1440}
      - META_SYNC_INTERVAL_MIN=${META_SYNC_INTERVAL_MIN:-60}
      - META_TICK_SECONDS=${META_TICK_SECONDS:-30}
      - META_BATCH_SIZE=${META_BATCH_SIZE:-40}
      - META_LIVE_CACHE_SECONDS=${META_LIVE_CACHE_SECONDS:-60}
      - META_LIVE_TIMEOUT_SECONDS=${META_LIVE_TIMEOUT_SECONDS:-10}
      - META_LIVE_MAX_REQUESTS_PER_MINUTE=${META_LIVE_MAX_REQUESTS_PER_MINUTE:-60}
      - SCORE_WINDOW_DAYS=${SCORE_WINDOW_DAYS:-90}
      - SYNC_MONTHS_BACK=${SYNC_MONTHS_BACK:-2}
      - SYNC_TICK_SECONDS=${SYNC_TICK_SECONDS:-60}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-180}
      - SYNC_MAX_REQUESTS_PER_TICK=${SYNC_MAX_REQUESTS_PER_TICK:-180}
      - GMGN_TZ_NAME=${GMGN_TZ_NAME:-Asia/Shanghai}
      - GMGN_TZ_OFFSET=${GMGN_TZ_OFFSET:-28800}
      - SYNC_LOG_RETENTION_DAYS=${SYNC_LOG_RETENTION_DAYS:-7}
      - TRACK_MAX_CONCURRENT=${TRACK_MAX_CONCURRENT:-4}
      - MAX_BATCH_WALLETS=${MAX_BATCH_WALLETS:-500}
      - MAX_BATCH_PROFIT_ADDRESSES=${MAX_BATCH_PROFIT_ADDRESSES:-30}
      - PORT=8038
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8038/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gmgndaily_data:
