version: '3.8'

services:
  gmgndaily:
    build: .
    restart: always
    ports:
      - "8038:8038"
    volumes:
      - gmgndaily_data:/data
    environment:
      - DATABASE_PATH=/data/gmgndaily.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8038/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gmgndaily_data:
    driver: local
