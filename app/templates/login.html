<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GMGN Daily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#3b82f6', danger: '#ef4444'}}}};</script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #16213e 100%);
            background-attachment: fixed;
        }
        .glass { 
            background: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(75, 85, 99, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-100 px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-primary to-blue-500 bg-clip-text text-transparent">GMGN Daily</h1>
            <p class="text-sm text-gray-400 mt-2">Solana 钱包盈利监控系统</p>
        </div>
        
        <div class="glass rounded-2xl p-8 shadow-2xl">
            {% if error %}
            <div class="mb-6 px-4 py-3 rounded-lg bg-danger/10 border border-danger/30 text-sm text-red-300 flex items-start gap-2">
                <span class="text-lg">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form method="post" action="/login" class="space-y-5">
                <input type="hidden" name="next" value="{{ next }}">
                
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">用户名</label>
                    <input type="text" name="username" required autocomplete="username"
                           class="w-full bg-gray-900/50 border border-gray-700/50 rounded-lg px-4 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary/50 transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">密码</label>
                    <input type="password" name="password" required autocomplete="current-password"
                           class="w-full bg-gray-900/50 border border-gray-700/50 rounded-lg px-4 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary/50 transition">
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-primary to-blue-600 hover:from-blue-600 hover:to-primary text-white py-2.5 rounded-lg font-medium transition shadow-lg shadow-primary/30 mt-6">
                    登录
                </button>
            </form>
        </div>
        
        <p class="text-center text-xs text-gray-500 mt-6">安全登录 · 保护您的钱包数据</p>
    </div>
</body>
</html>
